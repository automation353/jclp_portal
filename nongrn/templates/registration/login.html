{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Non GRN Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="{% static 'nongrn/app.css' %}?v={{ asset_version }}"></head>
<body class="login-body">
<form method="post" class="login-card">{% csrf_token %}
  <div class="text-center mb-4">
    <div class="sb-logo"><i class="bi bi-grid-3x3-gap-fill"></i></div>
    <h1 class="h5 fw-bold mb-1">Non GRN Age Portal</h1>
    <div class="small text-muted">Jolly Clamps · Accounts &amp; Finance</div>
  </div>
  {% if form.errors %}<div class="alert alert-danger py-2 small"><i class="bi bi-exclamation-circle"></i> Username or password is incorrect.</div>{% endif %}
  <label class="form-label small fw-semibold" for="u">Username</label>
  <input id="u" type="text" name="username" class="form-control mb-3" autocomplete="username" autofocus required>
  <label class="form-label small fw-semibold" for="p">Password</label>
  <input id="p" type="password" name="password" class="form-control mb-4" autocomplete="current-password" required>
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn btn-brand w-100 py-2">Sign in</button>
</form></body></html>
