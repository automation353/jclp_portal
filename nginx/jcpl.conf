server {

    server_name jcplportal.tech www.jcplportal.tech 200.141.14.164;

    # Big enough for real xlsx uploads (defaults to 1 MB otherwise).
    client_max_body_size 50m;

    # React SPA build
    root /root/jclp_automation_portal/jcpl/frontend/dist;
    index index.html;

    # MTO/MTS xlsx upload — parsing 1650+ items can exceed nginx's default
    # 60 s proxy_read_timeout on the dev server. Give it 10 minutes and
    # keep large bodies in a real temp file instead of memory.
    location = /api/mto-mts/uploads/new/ {
        proxy_pass                 http://127.0.0.1:8000;
        proxy_http_version         1.1;
        proxy_set_header           Host              $host;
        proxy_set_header           X-Real-IP         $remote_addr;
        proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header           X-Forwarded-Proto $scheme;
        proxy_request_buffering    on;
        proxy_connect_timeout      60s;
        proxy_send_timeout         600s;
        proxy_read_timeout         600s;
        client_body_timeout        600s;
        send_timeout               600s;
    }

    # R3SS recompute triggers a full Apps Script rebuild (3000+ rows) then
    # reads the sheet back — can take a few minutes. Give it 10 minutes.
    location = /api/ppc-data/r3ss/recompute-sheet/ {
        proxy_pass                 http://127.0.0.1:8000;
        proxy_http_version         1.1;
        proxy_set_header           Host              $host;
        proxy_set_header           X-Real-IP         $remote_addr;
        proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header           X-Forwarded-Proto $scheme;
        proxy_connect_timeout      60s;
        proxy_send_timeout         600s;
        proxy_read_timeout         600s;
        send_timeout               600s;
    }

    # Django REST API
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Django admin
    location /admin/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Django-collected static (admin CSS, DRF browsable API, etc.)
    location /static/ {
        alias /root/jclp_automation_portal/jcpl/staticfiles/;
        access_log off;
        expires 7d;
    }

    # Hashed assets — cache forever (filename changes on rebuild)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any non-file request falls through to index.html
    # index.html must never be cached — it carries the hashed asset URLs
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/jcplportal.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jcplportal.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.jcplportal.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = jcplportal.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    listen 4000;
    listen [::]:4000;

    server_name jcplportal.tech www.jcplportal.tech 200.141.14.164;
    return 404; # managed by Certbot




}