server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 4000;
    listen [::]:4000;

    server_name _;

    # Big enough for real xlsx uploads (defaults to 1 MB otherwise).
    client_max_body_size 50m;

    # React SPA build
    root /root/jclp_automation_portal/jcpl/frontend/dist;
    index index.html;

    # MTO/MTS xlsx upload — parsing 1650+ items can exceed nginx's default
    # 60 s proxy_read_timeout on the dev server. Give it 10 minutes and
    # keep large bodies in a real temp file instead of memory.
    location = /api/mto-mts/uploads/new/ {
        proxy_pass                 http://127.0.0.1:8000;
        proxy_http_version         1.1;
        proxy_set_header           Host              $host;
        proxy_set_header           X-Real-IP         $remote_addr;
        proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header           X-Forwarded-Proto $scheme;
        proxy_request_buffering    on;
        proxy_connect_timeout      60s;
        proxy_send_timeout         600s;
        proxy_read_timeout         600s;
        client_body_timeout        600s;
        send_timeout               600s;
    }

    # Django REST API
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Django admin
    location /admin/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Django-collected static (admin CSS, DRF browsable API, etc.)
    location /static/ {
        alias /root/jclp_automation_portal/jcpl/staticfiles/;
        access_log off;
        expires 7d;
    }

    # SPA fallback: any non-file request falls through to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
