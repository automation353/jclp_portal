<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" font-family="Arial, Helvetica, sans-serif">
  <rect width="1100" height="520" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1b2733">Where the SMTP credential lives, and who can reach it</text>
  <text x="550" y="55" text-anchor="middle" font-size="13" fill="#5a6b7a">One file, one reader, one sender — no copies anywhere else on disk</text>

  <!-- Google account -->
  <rect x="30" y="90" width="230" height="80" rx="8" fill="#e8ecf1" stroke="#8a97a6" stroke-width="1.5"/>
  <text x="145" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2733">Google Workspace</text>
  <text x="145" y="136" text-anchor="middle" font-size="10.5" fill="#455261">automation@jollyclamps.com</text>
  <text x="145" y="152" text-anchor="middle" font-size="10" font-style="italic" fill="#7a8a98">App Password issued here</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a6a8c"/>
    </marker>
  </defs>
  <line x1="260" y1="130" x2="330" y2="130" stroke="#4a6a8c" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="295" y="120" text-anchor="middle" font-size="9.5" fill="#4a6a8c">pasted once</text>

  <!-- .env file -->
  <rect x="330" y="90" width="230" height="80" rx="8" fill="#fff3d6" stroke="#c9962e" stroke-width="1.5"/>
  <text x="445" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3d05">/root/.env</text>
  <text x="445" y="133" text-anchor="middle" font-size="10.5" fill="#6b4d10">Plaintext file · mode 600</text>
  <text x="445" y="149" text-anchor="middle" font-size="10.5" fill="#6b4d10">Owner: root · Group: root</text>
  <text x="445" y="163" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8a6a20">readable only by root</text>

  <line x1="445" y1="170" x2="445" y2="220" stroke="#4a6a8c" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="620" y="200" text-anchor="middle" font-size="9.5" fill="#4a6a8c">read once, at process start (load_dotenv)</text>

  <!-- settings.py -->
  <rect x="330" y="228" width="230" height="70" rx="8" fill="#dce9f7" stroke="#4a78b0" stroke-width="1.5"/>
  <text x="445" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2733">jcpl/settings.py</text>
  <text x="445" y="270" text-anchor="middle" font-size="10" fill="#2e4a68">EMAIL_HOST_USER, EMAIL_HOST_PASSWORD</text>
  <text x="445" y="284" text-anchor="middle" font-size="9.5" font-style="italic" fill="#4a6a8c">held only in process memory</text>

  <line x1="445" y1="298" x2="445" y2="336" stroke="#4a6a8c" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- notify.py -->
  <rect x="330" y="344" width="230" height="60" rx="8" fill="#dff2e3" stroke="#3d8b52" stroke-width="1.5"/>
  <text x="445" y="368" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2733">portal/notify.py</text>
  <text x="445" y="386" text-anchor="middle" font-size="10" fill="#2e5a3a">one send path for every alert</text>

  <line x1="560" y1="374" x2="770" y2="290" stroke="#3d8b52" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="700" y="330" text-anchor="middle" font-size="9.5" fill="#3d8b52">TLS on port 587</text>

  <!-- gmail smtp relay -->
  <rect x="770" y="230" width="260" height="80" rx="8" fill="#e8ecf1" stroke="#8a97a6" stroke-width="1.5"/>
  <text x="900" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2733">smtp.gmail.com : 587</text>
  <text x="900" y="274" text-anchor="middle" font-size="10.5" fill="#455261">STARTTLS encrypted in transit</text>
  <text x="900" y="292" text-anchor="middle" font-size="10.5" fill="#455261">authenticates as automation@…</text>

  <line x1="900" y1="310" x2="900" y2="360" stroke="#4a6a8c" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- inbox -->
  <rect x="770" y="368" width="260" height="60" rx="8" fill="#f0f4f8" stroke="#6b7f93" stroke-width="1.5"/>
  <text x="900" y="392" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2733">automation@jollyclamps.com</text>
  <text x="900" y="410" text-anchor="middle" font-size="10" fill="#455261">inbox — the alert lands here</text>

  <!-- never touches -->
  <rect x="30" y="228" width="230" height="176" rx="8" fill="#f6e2e2" stroke="#a35a5a" stroke-width="1.5"/>
  <text x="145" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5a2e2e">Never touches:</text>
  <text x="145" y="274" text-anchor="middle" font-size="10.5" fill="#7a4a4a">git history</text>
  <text x="145" y="294" text-anchor="middle" font-size="10.5" fill="#7a4a4a">application logs</text>
  <text x="145" y="314" text-anchor="middle" font-size="10.5" fill="#7a4a4a">the database</text>
  <text x="145" y="334" text-anchor="middle" font-size="10.5" fill="#7a4a4a">the frontend bundle</text>
  <text x="145" y="354" text-anchor="middle" font-size="10.5" fill="#7a4a4a">any per-app .env file</text>
  <text x="145" y="374" text-anchor="middle" font-size="10.5" fill="#7a4a4a">any HTTP response</text>
  <text x="145" y="394" text-anchor="middle" font-size="9" font-style="italic" fill="#8a6060">verified by direct grep, 20 Aug 2026</text>

  <text x="550" y="475" text-anchor="middle" font-size="11" font-style="italic" fill="#8a97a6">One known exception: the app password was pasted into this chat session on 20 Aug 2026 — see Section 4.</text>
</svg>
