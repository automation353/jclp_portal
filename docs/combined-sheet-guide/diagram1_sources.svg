<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" font-family="Arial, Helvetica, sans-serif">
  <rect width="1100" height="760" fill="#ffffff"/>

  <text x="550" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b2733">How data reaches the "combined" tab</text>
  <text x="550" y="56" text-anchor="middle" font-size="13" fill="#5a6b7a">Four source tabs, each fed a different way, joined row-by-row into one master sheet</text>

  <!-- Legend -->
  <rect x="30" y="76" width="14" height="14" fill="#e8ecf1" stroke="#8a97a6"/>
  <text x="50" y="87" font-size="12" fill="#33414d">Manual TCS iON export, uploaded by a person</text>
  <rect x="330" y="76" width="14" height="14" fill="#dce9f7" stroke="#4a78b0"/>
  <text x="350" y="87" font-size="12" fill="#33414d">Automated n8n workflow</text>
  <rect x="560" y="76" width="14" height="14" fill="#dff2e3" stroke="#3d8b52"/>
  <text x="580" y="87" font-size="12" fill="#33414d">Google Apps Script</text>

  <!-- Source tab boxes row -->
  <!-- rm_green_level -->
  <rect x="30" y="130" width="230" height="110" rx="8" fill="#e8ecf1" stroke="#8a97a6" stroke-width="1.5"/>
  <text x="145" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2733">rm_green_level</text>
  <text x="145" y="174" text-anchor="middle" font-size="10.5" fill="#455261">Tally Code, RM Code,</text>
  <text x="145" y="188" text-anchor="middle" font-size="10.5" fill="#455261">Location, RM Spec, Grade,</text>
  <text x="145" y="202" text-anchor="middle" font-size="10.5" fill="#455261">Component Item, Group,</text>
  <text x="145" y="216" text-anchor="middle" font-size="10.5" fill="#455261">Section, Lead Time (Days)</text>
  <text x="145" y="234" text-anchor="middle" font-size="10" font-style="italic" fill="#7a8a98">manual TCS iON upload</text>

  <!-- rm_consumption -->
  <rect x="290" y="130" width="230" height="110" rx="8" fill="#e8ecf1" stroke="#8a97a6" stroke-width="1.5"/>
  <text x="405" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2733">rm_consumption</text>
  <text x="405" y="174" text-anchor="middle" font-size="10.5" fill="#455261">RM Code, Tally Code,</text>
  <text x="405" y="188" text-anchor="middle" font-size="10.5" fill="#455261">Category, Levels</text>
  <text x="405" y="234" text-anchor="middle" font-size="10" font-style="italic" fill="#7a8a98">manual TCS iON upload</text>

  <!-- mps_demand -->
  <rect x="550" y="130" width="230" height="110" rx="8" fill="#e8ecf1" stroke="#8a97a6" stroke-width="1.5"/>
  <text x="665" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2733">mps_demand</text>
  <text x="665" y="174" text-anchor="middle" font-size="10.5" fill="#455261">Tally Code, Total RM</text>
  <text x="665" y="234" text-anchor="middle" font-size="10" font-style="italic" fill="#7a8a98">manual TCS iON upload</text>

  <!-- stock_valuation -->
  <rect x="810" y="130" width="260" height="110" rx="8" fill="#dce9f7" stroke="#4a78b0" stroke-width="1.5"/>
  <text x="940" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2733">stock_valuation</text>
  <text x="940" y="174" text-anchor="middle" font-size="10.5" fill="#2e4a68">Opening / Receipt / Issued /</text>
  <text x="940" y="188" text-anchor="middle" font-size="10.5" fill="#2e4a68">Closing qty &amp; cost, 75 cols</text>
  <text x="940" y="206" text-anchor="middle" font-size="10" font-style="italic" fill="#4a6a8c">Drive folder "tcsion_data"</text>
  <text x="940" y="220" text-anchor="middle" font-size="10" font-style="italic" fill="#4a6a8c">n8n: daily 8:00am IST</text>
  <text x="940" y="234" text-anchor="middle" font-size="10" font-style="italic" fill="#4a6a8c">(new flow — Aug 2026)</text>

  <!-- Arrows down from each source box to combined -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5a6b7a"/>
    </marker>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3d6ea3"/>
    </marker>
  </defs>

  <line x1="145" y1="240" x2="145" y2="330" stroke="#5a6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="405" y1="240" x2="405" y2="330" stroke="#5a6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="665" y1="240" x2="665" y2="330" stroke="#5a6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="940" y1="240" x2="940" y2="330" stroke="#3d6ea3" stroke-width="1.5" marker-end="url(#arrowblue)"/>

  <!-- combined tab -->
  <rect x="30" y="340" width="1040" height="90" rx="8" fill="#fff3d6" stroke="#c9962e" stroke-width="2"/>
  <text x="550" y="368" text-anchor="middle" font-size="15" font-weight="bold" fill="#5a3d05">combined</text>
  <text x="550" y="388" text-anchor="middle" font-size="11" fill="#6b4d10">One row per RM item. Every cell is a formula, not typed data — Item Code, Location, RM Spec, Grade, Component Item,</text>
  <text x="550" y="404" text-anchor="middle" font-size="11" fill="#6b4d10">Group, Section, Lead Time pull from rm_green_level · Category, Levels pull from rm_consumption · MPS Demand pulls</text>
  <text x="550" y="420" text-anchor="middle" font-size="11" fill="#6b4d10">from mps_demand · Opening/Receipt/Issued/Stock likely pull from stock_valuation (see note below)</text>

  <!-- formula pattern box -->
  <rect x="30" y="452" width="1040" height="128" rx="8" fill="#f5f5f5" stroke="#c7c7c7"/>
  <text x="50" y="474" font-size="12.5" font-weight="bold" fill="#1b2733">The formula pattern (verified live, 20 Aug 2026):</text>
  <text x="50" y="496" font-size="11.5" font-family="Consolas, monospace" fill="#7a2e2e">Item Code (D2)  =IFERROR(rm_green_level!A2, "")</text>
  <text x="50" y="514" font-size="11" fill="#455261">→ pulls row 2 of rm_green_level's column A into row 2 of combined. Row-position match, NOT a lookup by key —</text>
  <text x="50" y="530" font-size="11" fill="#455261">   if the two tabs' rows ever fall out of alignment, this silently pairs the wrong item with the wrong row.</text>
  <text x="50" y="552" font-size="11.5" font-family="Consolas, monospace" fill="#7a2e2e">Daily Consumption (J2)  =IF(H2=0, 0, H2/15)</text>
  <text x="50" y="570" font-size="11" fill="#455261">→ computed locally from Levels (H) in the SAME row — a planning assumption (÷15), not a measured figure.</text>

  <!-- footer note -->
  <text x="550" y="612" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8a97a6">Every one of these formulas is wrapped in IFERROR — a lookup that fails returns "" or 0, which looks</text>
  <text x="550" y="628" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8a97a6">identical to a genuine blank/zero. This is the single biggest data-trust risk in the whole sheet — see Section 4.</text>

  <text x="550" y="670" text-anchor="middle" font-size="12" fill="#455261">Not yet part of "combined" today:</text>
  <rect x="330" y="686" width="440" height="46" rx="8" fill="#f6e2e2" stroke="#a35a5a"/>
  <text x="550" y="706" text-anchor="middle" font-size="11" fill="#5a2e2e">po  ·  po_highlighted_columns  ·  dpr_po_joined</text>
  <text x="550" y="722" text-anchor="middle" font-size="10" fill="#7a4a4a">Purchase Order data — tracked, but not yet joined into this sheet</text>
</svg>
